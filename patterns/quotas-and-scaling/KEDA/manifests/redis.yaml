# -------------------------------------------------------------
# Event Source: Redis
# -------------------------------------------------------------
# This is a simple Redis instance that acts as our "External Event Source".
# KEDA will query this instance (e.g., checking the length of a list)
# to determine if it needs to activate (0->1) or scale (1->N) the consumers.
# -------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    app: redis
spec:
  containers:
  - name: redis
    image: redis:alpine
    ports:
    - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
spec:
  selector:
    app: redis
  ports:
  - port: 6379