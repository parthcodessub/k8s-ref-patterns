# ==============================================================================
# PHASE: INITIAL ROLLOUT (Baseline)
# ==============================================================================
# This manifest performs the initial deployment of the 'veggie-api' application.
# It sets the baseline (v1.0.0) so that subsequent canary/blue-green updates
# have a stable version to migrate traffic from.
#
# DESIGN:
# - Uses Argo Rollouts for advanced deployment patterns.
# - Strategy: Canary (set to 100% immediately for the first installation).
# - Replicas: 4 pods to ensure high availability during the baseline phase.
# ==============================================================================

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: veggie-api-rollout
  labels:
    app: veggie-api
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: veggie-api
  # FIX: Explicitly define the Canary strategy to satisfy the validator.
  # We set weight to 100% immediately for this initial setup.
  strategy:
    canary:
      steps:
      - setWeight: 100
  template:
    metadata:
      labels:
        app: veggie-api
    spec:
      containers:
      - name: veggie-api
        # Initial 'Blue' Version (v1.0.0)
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: veggie-api-service
spec:
  selector:
    app: veggie-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer