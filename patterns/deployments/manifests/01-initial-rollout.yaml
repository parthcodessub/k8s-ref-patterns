# 01-initial-rollout.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: veggie-api-rollout
  labels:
    app: veggie-api
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: veggie-api
  # FIX: Explicitly define the Canary strategy to satisfy the validator.
  # We set weight to 100% immediately for this initial setup.
  strategy:
    canary:
      steps:
      - setWeight: 100
  template:
    metadata:
      labels:
        app: veggie-api
    spec:
      containers:
      - name: veggie-api
        # Initial 'Blue' Version (v1.0.0)
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: veggie-api-service
spec:
  selector:
    app: veggie-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer