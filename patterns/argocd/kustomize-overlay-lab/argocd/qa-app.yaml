apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/parthcodessub/k8s-ref-patterns.git
    targetRevision: HEAD
    path: patterns/argocd/kustomize-overlay-lab/overlays/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy: 
    # MANUAL MODE (Approval Gate): 
    # By commenting out 'automated', we require a human to click "Sync" in the 
    # Argo CD UI. This allows us to review the "Diff" before changes are applied to QA.
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
    - CreateNamespace=true
